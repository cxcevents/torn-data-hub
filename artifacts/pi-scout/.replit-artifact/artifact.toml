kind = "web"
previewPath = "/pi-scout/"
title = "PI Marriage Scout"
version = "1.0.0"
id = "artifacts/pi-scout"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pi-scout/" ]
localPort = 19751

[services.development]
run = "pnpm --filter @workspace/pi-scout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pi-scout", "run", "build" ]
publicDir = "artifacts/pi-scout/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19751"
BASE_PATH = "/pi-scout/"
